# Trivy 0.74 detects the public type marker alone as a GCP credential.
# Exclude only this exact Python dictionary of environment-variable references.
# Any literal credential or extra field breaks the match and remains scanned.
# Regression: python3 scripts/test-trivy-secret-config.py
exclude-block:
  description: Google Sheets credential template contains no embedded credential
  regexes:
    - '\{\s*"type": "service_account",\s*"client_email": SHEETS_CLIENT_EMAIL,\s*"private_key": SHEETS_PRIVATE_KEY,\s*"token_uri": "https://oauth2\.googleapis\.com/token",\s*\}'

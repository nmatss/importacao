services:
  redis:
    image: redis:7-alpine
    container_name: importacao-redis
    restart: unless-stopped
    # Redis only accessible internally (no host port exposure)
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  postgres:
    image: postgres:16-alpine
    container_name: importacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: importacao-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      API_PORT: 3001
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_PROVIDER: ${AI_PROVIDER:-ialocal}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-false}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-200}
      # IA_LOCAL / DocIntel (on-prem) é o provider padrão para documentos sensíveis.
      IA_LOCAL_BASE_URL: ${IA_LOCAL_BASE_URL:-http://ia-local-gateway:8443/v1}
      IA_LOCAL_API_KEY: ${IA_LOCAL_API_KEY:-}
      IA_LOCAL_MODEL: ${IA_LOCAL_MODEL:-unico-docintel}
      IA_LOCAL_EMBED_MODEL: ${IA_LOCAL_EMBED_MODEL:-bge-m3}
      IA_LOCAL_ALLOWED_HOSTS: ${IA_LOCAL_ALLOWED_HOSTS:-ia-local-gateway}
      AI_USE_SPECIALIST: ${AI_USE_SPECIALIST:-1}
      AI_LOCAL_CHAT_TIMEOUT_MS: ${AI_LOCAL_CHAT_TIMEOUT_MS:-360000}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-us-central1}
      GOOGLE_VERTEX_CLIENT_EMAIL: ${GOOGLE_VERTEX_CLIENT_EMAIL:-}
      GOOGLE_VERTEX_PRIVATE_KEY: ${GOOGLE_VERTEX_PRIVATE_KEY:-}
      GOOGLE_DRIVE_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_DRIVE_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_PRE_CONS_FOLDER_ID: ${GOOGLE_DRIVE_PRE_CONS_FOLDER_ID:-}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      KIOM_EMAIL: ${KIOM_EMAIL:-}
      FENICIA_EMAIL: ${FENICIA_EMAIL:-}
      ISA_EMAIL: ${ISA_EMAIL:-}
      COMMUNICATION_ALLOWED_RECIPIENTS: ${COMMUNICATION_ALLOWED_RECIPIENTS:-}
      GMAIL_SHARED_MAILBOX: ${GMAIL_SHARED_MAILBOX:-}
      EMAIL_INGESTION_ENABLED: ${EMAIL_INGESTION_ENABLED:-false}
      EMAIL_ALLOWED_SENDERS: ${EMAIL_ALLOWED_SENDERS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCUMENT_PROCESSING_STALE_MINUTES: ${DOCUMENT_PROCESSING_STALE_MINUTES:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      SYDLE_SYNC_ENABLED: ${SYDLE_SYNC_ENABLED:-false}
      SYDLE_SOURCE_TYPE: ${SYDLE_SOURCE_TYPE:-generic}
      SYDLE_BASE_URL: ${SYDLE_BASE_URL:-}
      SYDLE_API_TOKEN: ${SYDLE_API_TOKEN:-}
      SYDLE_PAYMENTS_PATH: ${SYDLE_PAYMENTS_PATH:-/api/purchase-payments}
      SYDLE_AUTH_HEADER: ${SYDLE_AUTH_HEADER:-Authorization}
      SYDLE_AUTH_SCHEME: ${SYDLE_AUTH_SCHEME:-Bearer}
      SYDLE_UPDATED_AFTER_PARAM: ${SYDLE_UPDATED_AFTER_PARAM:-updatedAfter}
      SYDLE_PAGE_PARAM: ${SYDLE_PAGE_PARAM:-page}
      SYDLE_PAGE_SIZE_PARAM: ${SYDLE_PAGE_SIZE_PARAM:-pageSize}
      SYDLE_PAGE_SIZE: ${SYDLE_PAGE_SIZE:-200}
      SYDLE_TIMEOUT_MS: ${SYDLE_TIMEOUT_MS:-30000}
      SYDLE_APP: ${SYDLE_APP:-main}
      SYDLE_USER: ${SYDLE_USER:-}
      SYDLE_PASSWORD: ${SYDLE_PASSWORD:-}
      SYDLE_CLASS_ID: ${SYDLE_CLASS_ID:-}
      SYDLE_DATE_FIELD: ${SYDLE_DATE_FIELD:-_lastUpdateDate}
      SYDLE_TICKET_CLASS_ID: ${SYDLE_TICKET_CLASS_ID:-5d446dfc62d9656275a47d69}
      SYDLE_TICKET_STATUS_CLASS_ID: ${SYDLE_TICKET_STATUS_CLASS_ID:-5cacdc04a50bfe4c0d3e5c74}
      SYDLE_CURRENCY_CLASS_ID: ${SYDLE_CURRENCY_CLASS_ID:-000000000000000000000059}
      # Caso B (enriquecimento): classes vizinhas confirmadas pelo probe em grupounico.sydle.one.
      SYDLE_BRAND_CLASS_ID: ${SYDLE_BRAND_CLASS_ID:-685179c16732f5038aaed372}
      SYDLE_RECIPIENT_CLASS_ID: ${SYDLE_RECIPIENT_CLASS_ID:-689cd3bd27624d322604be16}
      SYDLE_ENTERPRISE_CLASS_ID: ${SYDLE_ENTERPRISE_CLASS_ID:-591365fef5ca53284cd8d159}
      # Liga o join da 2a tabela (requestData + classes vizinhas): processCode,
      # invoiceNumber, brand, supplierName. Validado read-only em 2026-06-21
      # (8/8 fornecedor+invoice, 6/8 processCode). Default OFF; ligar via SOPS.
      SYDLE_ONE_ENRICH_FIELDS: ${SYDLE_ONE_ENRICH_FIELDS:-false}
      GOOGLE_ADMIN_EMAIL: ${GOOGLE_ADMIN_EMAIL:-}
      GOOGLE_GROUP_ALLOWED: ${GOOGLE_GROUP_ALLOWED:?GOOGLE_GROUP_ALLOWED is required}
      GOOGLE_GROUP_ALLOW_ALL_WHEN_UNSET: ${GOOGLE_GROUP_ALLOW_ALL_WHEN_UNSET:-false}
      REDIS_URL: redis://redis:6379
      # Sentry (observability). Empty DSN keeps Sentry disabled (see shared/observability/sentry.ts).
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-dev}
      METRICS_ALLOW_PRIVATE_NETWORKS: ${METRICS_ALLOW_PRIVATE_NETWORKS:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status)))).then(j => process.exit(j.status === 'ok' && j.checks?.db?.ok && j.checks?.redis?.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - ia-local-net

  cert-volumes-init:
    image: alpine:3.22
    container_name: importacao-cert-volumes-init
    command: ["sh", "-c", "chown -R 1001:1001 /app/reports /app/certs"]
    volumes:
      - cert-reports:/app/reports
      - cert-certs:/app/certs
    restart: "no"

  cert-api:
    build:
      context: ./apps/cert-api
      dockerfile: Dockerfile
    container_name: importacao-cert-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:?GOOGLE_SHEETS_SPREADSHEET_ID is required}
      WMS_ORACLE_HOST: ${WMS_ORACLE_HOST:?WMS_ORACLE_HOST is required}
      WMS_ORACLE_PORT: ${WMS_ORACLE_PORT:?WMS_ORACLE_PORT is required}
      WMS_ORACLE_SID: ${WMS_ORACLE_SID:?WMS_ORACLE_SID is required}
      WMS_ORACLE_USER: ${WMS_ORACLE_USER:?WMS_ORACLE_USER is required}
      WMS_ORACLE_PASS: ${WMS_ORACLE_PASS:?WMS_ORACLE_PASS is required}
      ERP_PUKET_HOST: ${ERP_PUKET_HOST:?ERP_PUKET_HOST is required}
      ERP_PUKET_DB: ${ERP_PUKET_DB:?ERP_PUKET_DB is required}
      ERP_IMG_HOST: ${ERP_IMG_HOST:?ERP_IMG_HOST is required}
      ERP_IMG_DB: ${ERP_IMG_DB:?ERP_IMG_DB is required}
      ERP_MSSQL_USER: ${ERP_MSSQL_USER:?ERP_MSSQL_USER is required}
      ERP_MSSQL_PASS: ${ERP_MSSQL_PASS:?ERP_MSSQL_PASS is required}
      LINX_WRITE_ENABLED: ${LINX_WRITE_ENABLED:-false}
      LINX_PROP_TABLE: ${LINX_PROP_TABLE:-PROP_PRODUTOS}
      LINX_PROP_COL_PRODUTO: ${LINX_PROP_COL_PRODUTO:-PRODUTO}
      LINX_PROP_COL_PROPRIEDADE: ${LINX_PROP_COL_PROPRIEDADE:-PROPRIEDADE}
      LINX_PROP_COL_VALOR: ${LINX_PROP_COL_VALOR:-VALOR_PROPRIEDADE}
      LINX_SKU_IS_PRODUTO: ${LINX_SKU_IS_PRODUTO:-false}
      LINX_PRODUTO_TABLE: ${LINX_PRODUTO_TABLE:-PRODUTOS}
      LINX_PRODUTO_COL_CODIGO: ${LINX_PRODUTO_COL_CODIGO:-PRODUTO}
      LINX_PRODUTO_COL_SKU: ${LINX_PRODUTO_COL_SKU:-}
      LINX_DATE_FORMAT: ${LINX_DATE_FORMAT:-%d/%m/%Y}
      CERT_API_KEY: ${CERT_API_KEY:?CERT_API_KEY is required}
    volumes:
      - cert-reports:/app/reports
      # Certificate PDFs (INMETRO/ANVISA evidence) live in CERTS_DIR=/app/certs
      # (apps/cert-api/app/config.py). Without this named volume they are lost on
      # container restart.
      - cert-certs:/app/certs
    depends_on:
      cert-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
    container_name: importacao-web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      CERT_API_KEY: ${CERT_API_KEY:?CERT_API_KEY is required}
    depends_on:
      api:
        condition: service_healthy
      cert-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot
    container_name: importacao-certbot
    profiles: ["tls"]  # enable only after domain+DNS configured: `docker compose --profile tls up -d certbot`
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Initial issuance: docker compose -f docker-compose.prod.yml run --rm certbot certonly ...
    # Renewal: use scripts/renew-certs.sh via cron (twice daily)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done"
    depends_on:
      - web

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: importacao-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: importacao-alertmanager
    restart: unless-stopped
    # Internal only: Prometheus reaches it at alertmanager:9093 over the default
    # compose network. No host port published (no public exposure).
    expose:
      - "9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:11.2.2
    container_name: importacao-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  pgdata:
  redisdata:
  uploads:
  cert-reports:
  cert-certs:
  prometheusdata:
  grafanadata:
  alertmanagerdata:
  letsencrypt:
  certbot-webroot:

networks:
  ia-local-net:
    external: true

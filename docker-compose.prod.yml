services:
  redis:
    image: redis:7-alpine
    container_name: importacao-redis
    restart: unless-stopped
    # Redis only accessible internally (no host port exposure)
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  postgres:
    image: postgres:16-alpine
    container_name: importacao-postgres
    restart: unless-stopped
    # SEM `TZ`: de proposito. O banco roda em UTC e as colunas `timestamp` sem
    # time zone ja gravadas em producao guardam UTC. Definir TZ mudaria o fuso da
    # sessao e, com ele, como `NOW()` e a leitura de `timestamp` sao
    # interpretados — deslocando em 3h todos os dados existentes. Se um dia for
    # preciso, a migracao e converter as colunas para TIMESTAMPTZ antes (ver
    # cert_stock.synced_at em apps/cert-api/app/db/postgres.py), nao mexer no TZ.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: importacao-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      API_PORT: 3001
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_PROVIDER: ${AI_PROVIDER:-ialocal}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-false}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-200}
      # Self-repair no provider PAGO (re-ask de campos faltantes; custo centavos,
      # gated pelo teto diario). Lembrete: o compose lista env explicitamente —
      # sem esta linha, setar no .env nao chega ao container.
      AI_SELF_REPAIR_PAID: ${AI_SELF_REPAIR_PAID:-0}
      # IA_LOCAL / DocIntel (on-prem) é o provider padrão para documentos sensíveis.
      IA_LOCAL_BASE_URL: ${IA_LOCAL_BASE_URL:-http://ia-local-gateway:8443/v1}
      IA_LOCAL_API_KEY: ${IA_LOCAL_API_KEY:-}
      IA_LOCAL_MODEL: ${IA_LOCAL_MODEL:-unico-docintel}
      IA_LOCAL_EMBED_MODEL: ${IA_LOCAL_EMBED_MODEL:-bge-m3}
      IA_LOCAL_ALLOWED_HOSTS: ${IA_LOCAL_ALLOWED_HOSTS:-ia-local-gateway}
      AI_USE_SPECIALIST: ${AI_USE_SPECIALIST:-1}
      AI_LOCAL_CHAT_TIMEOUT_MS: ${AI_LOCAL_CHAT_TIMEOUT_MS:-360000}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-us-central1}
      GOOGLE_VERTEX_CLIENT_EMAIL: ${GOOGLE_VERTEX_CLIENT_EMAIL:-}
      GOOGLE_VERTEX_PRIVATE_KEY: ${GOOGLE_VERTEX_PRIVATE_KEY:-}
      GOOGLE_DRIVE_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_DRIVE_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_PRE_CONS_FOLDER_ID: ${GOOGLE_DRIVE_PRE_CONS_FOLDER_ID:-}
      GOOGLE_SHEETS_FOLLOW_UP_ID: ${GOOGLE_SHEETS_FOLLOW_UP_ID:-}
      GOOGLE_SHEETS_FOLLOW_UP_TAB: ${GOOGLE_SHEETS_FOLLOW_UP_TAB:-Processos}
      PROCESS_REFERENCE_SOURCE: ${PROCESS_REFERENCE_SOURCE:-follow_up}
      FOLLOW_UP_REFERENCE_TTL_MS: ${FOLLOW_UP_REFERENCE_TTL_MS:-600000}
      FOLLOW_UP_AUTO_CREATE: ${FOLLOW_UP_AUTO_CREATE:-1}
      DOCUMENT_SOURCE: ${DOCUMENT_SOURCE:-drive}
      DRIVE_INGESTION_MAX_FILE_BYTES: ${DRIVE_INGESTION_MAX_FILE_BYTES:-26214400}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Uni.co Importacao" <global@grupounico.com>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # Sem estas duas o operador podia definir a variavel no `.env` e nao ver
      # efeito nenhum: o compose so repassa o que lista explicitamente.
      # MAIL_DRY_RUN vazio = decide por NODE_ENV, que aqui e sempre `production`,
      # entao o padrao continua sendo ENVIAR de verdade.
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-}
      # `none` e o que o relay interno precisa; um relay que autentica de fato
      # exige SMTP_AUTH_MODE=login.
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:-none}
      KIOM_EMAIL: ${KIOM_EMAIL:-}
      FENICIA_EMAIL: ${FENICIA_EMAIL:-}
      ISA_EMAIL: ${ISA_EMAIL:-}
      COMMUNICATION_ALLOWED_RECIPIENTS: ${COMMUNICATION_ALLOWED_RECIPIENTS:-}
      COMMUNICATION_DEFAULT_CC: ${COMMUNICATION_DEFAULT_CC:-global@grupounico.com}
      MAIL_FORCE_OPERATIONAL_CC: ${MAIL_FORCE_OPERATIONAL_CC:-false}
      GMAIL_SHARED_MAILBOX: ${GMAIL_SHARED_MAILBOX:-global@grupounico.com}
      EMAIL_INGESTION_ENABLED: ${EMAIL_INGESTION_ENABLED:-false}
      EMAIL_ALLOWED_SENDERS: ${EMAIL_ALLOWED_SENDERS:-}
      EMAIL_PROCESSING_STALE_MINUTES: ${EMAIL_PROCESSING_STALE_MINUTES:-30}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_TLS_REJECT_UNAUTHORIZED: ${IMAP_TLS_REJECT_UNAUTHORIZED:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCUMENT_PROCESSING_STALE_MINUTES: ${DOCUMENT_PROCESSING_STALE_MINUTES:-30}
      DOCUMENT_EXTRACTION_LEASE_MS: ${DOCUMENT_EXTRACTION_LEASE_MS:-1500000}
      DOCUMENT_REPLAY_DEFER_DERIVED: ${DOCUMENT_REPLAY_DEFER_DERIVED:-0}
      # Guarda de bomba de descompressao (xlsx/docx). Ficam AQUI porque o
      # compose so repassa o que lista: definidas so no .env, nao teriam efeito
      # nenhum no container — o mesmo defeito ja registrado com MAIL_DRY_RUN.
      # Sao a valvula de escape do operador quando a guarda recusar um arquivo
      # grande legitimo, entao precisam funcionar de verdade.
      # ── Repassadas em bloco (2026-08-29) ────────────────────────────────
      # O servico usa lista EXPLICITA de environment: o que nao esta aqui nao
      # chega ao container, e uma variavel definida no .env nao faz nada. Ja
      # mordeu tres vezes (MAIL_DRY_RUN, os tetos da guarda de arquivo, e o
      # AI_DAILY_BUDGET_BRL, que estava definido no .env de producao enquanto o
      # proprio alerta mandava o operador ajusta-lo).
      #
      # Sem default duplicado de proposito: `${VAR:-}` passa string VAZIA, e os
      # leitores tratam vazio como ausente (`envTexto`/`envNumeroPositivo`, ou
      # `||`, ou comparacao com string). Assim o padrao do CODIGO e a fonte
      # unica e nao ha dois numeros para divergir.
      #
      # `env-repassado-ao-container.test.ts` falha quando uma leitura nova nasce
      # sem entrada aqui.
      AI_ANALYSIS_MODEL: ${AI_ANALYSIS_MODEL:-}
      AI_CHAT_TIMEOUT_MS: ${AI_CHAT_TIMEOUT_MS:-}
      AI_DEFAULT_MAX_OUTPUT_TOKENS: ${AI_DEFAULT_MAX_OUTPUT_TOKENS:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_SELF_REPAIR: ${AI_SELF_REPAIR:-}
      AI_STRUCTURED_OUTPUT: ${AI_STRUCTURED_OUTPUT:-}
      AI_UPGRADE_ON_CONTRACT_ERROR: ${AI_UPGRADE_ON_CONTRACT_ERROR:-}
      AI_UPGRADE_ON_LOW_CONFIDENCE: ${AI_UPGRADE_ON_LOW_CONFIDENCE:-}
      API_BASE_URL: ${API_BASE_URL:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-}
      AUTO_CLEAN_ITEM_CODES: ${AUTO_CLEAN_ITEM_CODES:-}
      AUTO_GENERATE_ESPELHO: ${AUTO_GENERATE_ESPELHO:-}
      DOCUMENT_AI_EXTRACTION_TIMEOUT_MS: ${DOCUMENT_AI_EXTRACTION_TIMEOUT_MS:-}
      DOCUMENT_PDF_RASTERIZE_ENABLED: ${DOCUMENT_PDF_RASTERIZE_ENABLED:-}
      DOCUMENT_SPREADSHEET_MAX_CHARS: ${DOCUMENT_SPREADSHEET_MAX_CHARS:-}
      DOCUMENT_TEXT_EXTRACTION_TIMEOUT_MS: ${DOCUMENT_TEXT_EXTRACTION_TIMEOUT_MS:-}
      EMAIL_ATTACHMENT_MAX_BYTES: ${EMAIL_ATTACHMENT_MAX_BYTES:-}
      EMAIL_BODY_MAX_CHARS: ${EMAIL_BODY_MAX_CHARS:-}
      EMAIL_TRANSIENT_MAX_ATTEMPTS: ${EMAIL_TRANSIENT_MAX_ATTEMPTS:-}
      ESPELHO_AI_FALLBACK: ${ESPELHO_AI_FALLBACK:-}
      IA_LOCAL_NUM_CTX: ${IA_LOCAL_NUM_CTX:-}
      IA_LOCAL_NUM_PREDICT: ${IA_LOCAL_NUM_PREDICT:-}
      METRICS_ALLOWED_IPS: ${METRICS_ALLOWED_IPS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PRE_CONS_SYNC_FORCE: ${PRE_CONS_SYNC_FORCE:-}
      PRE_CONS_SYNC_MAX_DROP_PCT: ${PRE_CONS_SYNC_MAX_DROP_PCT:-}
      STALLED_PROCESS_MILESTONE_DAYS: ${STALLED_PROCESS_MILESTONE_DAYS:-}
      VIMBAR_AUTO_LOCK: ${VIMBAR_AUTO_LOCK:-}
      VIMBAR_SENDER_DOMAINS: ${VIMBAR_SENDER_DOMAINS:-}
      X: ${X:-}
      LI_URGENT_WINDOW_DAYS: ${LI_URGENT_WINDOW_DAYS:-}
      DOCUMENT_PARSE_TIMEOUT_MS: ${DOCUMENT_PARSE_TIMEOUT_MS:-}
      AI_SELF_REPAIR_THRESHOLD: ${AI_SELF_REPAIR_THRESHOLD:-}
      AI_UPGRADE_CONFIDENCE_THRESHOLD: ${AI_UPGRADE_CONFIDENCE_THRESHOLD:-}
      AI_UPGRADE_MIN_DELTA: ${AI_UPGRADE_MIN_DELTA:-}
      # Teto de custo de IA. Estavam LIDAS pelo codigo e ausentes daqui, entao o
      # valor do .env de producao nunca chegava ao container — e o proprio alerta
      # de 80% instrui o operador a "ajustar AI_DAILY_BUDGET_BRL", que nao fazia
      # nada. Os defaults abaixo sao os MESMOS do codigo, entao ligar isto nao
      # muda o comportamento de hoje.
      #
      # O default explicito nao e enfeite: com `${VAR:-}` o compose passa STRING
      # VAZIA, e `Number('' ?? '100')` e 0 — o que DESLIGA o teto em vez de
      # aplica-lo. Aqui, ao contrario da guarda de arquivo, a leitura usa `??`,
      # que nao trata string vazia.
      AI_DAILY_BUDGET_BRL: ${AI_DAILY_BUDGET_BRL:-100}
      AI_BRL_PER_USD: ${AI_BRL_PER_USD:-5}
      DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-}
      DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_DOCX_BYTES: ${DOCUMENT_ARCHIVE_MAX_UNCOMPRESSED_DOCX_BYTES:-}
      DOCUMENT_ARCHIVE_MAX_RATIO: ${DOCUMENT_ARCHIVE_MAX_RATIO:-}
      DOCUMENT_OCR_ENABLED: ${DOCUMENT_OCR_ENABLED:-1}
      DOCUMENT_OCR_COMMAND: ${DOCUMENT_OCR_COMMAND:-tesseract}
      DOCUMENT_OCR_PDF_RENDERER: ${DOCUMENT_OCR_PDF_RENDERER:-pdftoppm}
      DOCUMENT_OCR_LANGUAGES: ${DOCUMENT_OCR_LANGUAGES:-por+eng}
      DOCUMENT_OCR_TIMEOUT_MS: ${DOCUMENT_OCR_TIMEOUT_MS:-60000}
      DOCUMENT_OCR_MAX_PAGES: ${DOCUMENT_OCR_MAX_PAGES:-20}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      SYDLE_SYNC_ENABLED: ${SYDLE_SYNC_ENABLED:-false}
      SYDLE_SOURCE_TYPE: ${SYDLE_SOURCE_TYPE:-generic}
      SYDLE_BASE_URL: ${SYDLE_BASE_URL:-}
      SYDLE_API_TOKEN: ${SYDLE_API_TOKEN:-}
      SYDLE_PAYMENTS_PATH: ${SYDLE_PAYMENTS_PATH:-/api/purchase-payments}
      SYDLE_AUTH_HEADER: ${SYDLE_AUTH_HEADER:-Authorization}
      SYDLE_AUTH_SCHEME: ${SYDLE_AUTH_SCHEME:-Bearer}
      SYDLE_UPDATED_AFTER_PARAM: ${SYDLE_UPDATED_AFTER_PARAM:-updatedAfter}
      SYDLE_PAGE_PARAM: ${SYDLE_PAGE_PARAM:-page}
      SYDLE_PAGE_SIZE_PARAM: ${SYDLE_PAGE_SIZE_PARAM:-pageSize}
      SYDLE_PAGE_SIZE: ${SYDLE_PAGE_SIZE:-200}
      SYDLE_TIMEOUT_MS: ${SYDLE_TIMEOUT_MS:-30000}
      SYDLE_APP: ${SYDLE_APP:-main}
      SYDLE_USER: ${SYDLE_USER:-}
      SYDLE_PASSWORD: ${SYDLE_PASSWORD:-}
      SYDLE_CLASS_ID: ${SYDLE_CLASS_ID:-}
      SYDLE_DATE_FIELD: ${SYDLE_DATE_FIELD:-_lastUpdateDate}
      SYDLE_TICKET_CLASS_ID: ${SYDLE_TICKET_CLASS_ID:-5d446dfc62d9656275a47d69}
      SYDLE_TICKET_STATUS_CLASS_ID: ${SYDLE_TICKET_STATUS_CLASS_ID:-5cacdc04a50bfe4c0d3e5c74}
      SYDLE_CURRENCY_CLASS_ID: ${SYDLE_CURRENCY_CLASS_ID:-000000000000000000000059}
      # Caso B (enriquecimento): classes vizinhas confirmadas pelo probe em grupounico.sydle.one.
      SYDLE_BRAND_CLASS_ID: ${SYDLE_BRAND_CLASS_ID:-685179c16732f5038aaed372}
      SYDLE_RECIPIENT_CLASS_ID: ${SYDLE_RECIPIENT_CLASS_ID:-689cd3bd27624d322604be16}
      SYDLE_ENTERPRISE_CLASS_ID: ${SYDLE_ENTERPRISE_CLASS_ID:-591365fef5ca53284cd8d159}
      # Liga o join da 2a tabela (requestData + classes vizinhas): processCode,
      # invoiceNumber, brand, supplierName. Validado read-only em 2026-06-21
      # (8/8 fornecedor+invoice, 6/8 processCode). Default OFF; ligar via SOPS.
      SYDLE_ONE_ENRICH_FIELDS: ${SYDLE_ONE_ENRICH_FIELDS:-false}
      GOOGLE_ADMIN_EMAIL: ${GOOGLE_ADMIN_EMAIL:-}
      GOOGLE_GROUP_ALLOWED: ${GOOGLE_GROUP_ALLOWED:?GOOGLE_GROUP_ALLOWED is required}
      GOOGLE_GROUP_ALLOW_ALL_WHEN_UNSET: ${GOOGLE_GROUP_ALLOW_ALL_WHEN_UNSET:-false}
      REDIS_URL: redis://redis:6379
      # Sentry (observability). Empty DSN keeps Sentry disabled (see shared/observability/sentry.ts).
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-dev}
      METRICS_ALLOW_PRIVATE_NETWORKS: ${METRICS_ALLOW_PRIVATE_NETWORKS:-true}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status)))).then(j => process.exit(j.status === 'ok' && j.checks?.db?.ok && j.checks?.redis?.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    networks:
      # A rota default TEM que sair pela rede do proprio stack. Em 07/08/2026 o
      # container subiu com a default via ia-local-net e ficou sem saida para a
      # internet — o IP dele naquele bridge nao e mascarado —, o que derrubou
      # login Google, sync SYDLE, Gmail e Drive por uma semana. ia-local-net
      # continua anexada (mesmo L2 do ia-local-gateway), so nao ganha o gateway.
      default:
        gw_priority: 100
      ia-local-net:
        gw_priority: -100

  cert-volumes-init:
    image: alpine:3.22
    container_name: importacao-cert-volumes-init
    command: ["sh", "-c", "chown -R 1001:1001 /app/reports /app/certs"]
    volumes:
      - cert-reports:/app/reports
      - cert-certs:/app/certs
    restart: "no"

  cert-api:
    build:
      context: ./apps/cert-api
      dockerfile: Dockerfile
    container_name: importacao-cert-api
    restart: unless-stopped
    environment:
      # Fuso do processo. So a cert-api recebe TZ: ela ja converte explicitamente
      # o que grava (`datetime.now(UTC)`) e o dia de negocio (`ZoneInfo` em
      # services/derivation.py), entao o TZ so muda log e `datetime.now()` naive.
      # `api` e `postgres` continuam em UTC de proposito — ver comentario no
      # servico `postgres` e shared/utils/dates.ts.
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:?GOOGLE_SHEETS_SPREADSHEET_ID is required}
      WMS_ORACLE_HOST: ${WMS_ORACLE_HOST:?WMS_ORACLE_HOST is required}
      WMS_ORACLE_PORT: ${WMS_ORACLE_PORT:?WMS_ORACLE_PORT is required}
      WMS_ORACLE_SID: ${WMS_ORACLE_SID:?WMS_ORACLE_SID is required}
      WMS_ORACLE_USER: ${WMS_ORACLE_USER:?WMS_ORACLE_USER is required}
      WMS_ORACLE_PASS: ${WMS_ORACLE_PASS:?WMS_ORACLE_PASS is required}
      ERP_PUKET_HOST: ${ERP_PUKET_HOST:?ERP_PUKET_HOST is required}
      ERP_PUKET_DB: ${ERP_PUKET_DB:?ERP_PUKET_DB is required}
      ERP_IMG_HOST: ${ERP_IMG_HOST:?ERP_IMG_HOST is required}
      ERP_IMG_DB: ${ERP_IMG_DB:?ERP_IMG_DB is required}
      ERP_MSSQL_USER: ${ERP_MSSQL_USER:?ERP_MSSQL_USER is required}
      ERP_MSSQL_PASS: ${ERP_MSSQL_PASS:?ERP_MSSQL_PASS is required}
      # db01 (Puket) e db02 (Imaginarium) sao instancias com logins SEPARADOS.
      # Sem estas, as duas marcas caem no ERP_MSSQL_* e uma delas falha o login.
      ERP_PUKET_USER: ${ERP_PUKET_USER:-}
      ERP_PUKET_PASS: ${ERP_PUKET_PASS:-}
      ERP_IMG_USER: ${ERP_IMG_USER:-}
      ERP_IMG_PASS: ${ERP_IMG_PASS:-}
      # ATENCAO: o default `false` abaixo NAO e o estado de producao. O valor
      # efetivo e `true` desde 2026-07-16, sobrescrito via SOPS — ou seja, a
      # escrita no ERP Linx (PROP_PRODUTOS) esta LIGADA. Ver docs/CERT-LINX-WRITE.md.
      # O default fica em `false` para que qualquer ambiente novo suba sem escrever.
      LINX_WRITE_ENABLED: ${LINX_WRITE_ENABLED:-false}
      LINX_PROP_TABLE: ${LINX_PROP_TABLE:-PROP_PRODUTOS}
      LINX_PROP_COL_PRODUTO: ${LINX_PROP_COL_PRODUTO:-PRODUTO}
      LINX_PROP_COL_PROPRIEDADE: ${LINX_PROP_COL_PROPRIEDADE:-PROPRIEDADE}
      LINX_PROP_COL_VALOR: ${LINX_PROP_COL_VALOR:-VALOR_PROPRIEDADE}
      # 3a coluna da PK de PROP_PRODUTOS: NOT NULL e sem default nas duas bases.
      LINX_PROP_COL_ITEM: ${LINX_PROP_COL_ITEM:-ITEM_PROPRIEDADE}
      LINX_PROP_ITEM_VALUE: ${LINX_PROP_ITEM_VALUE:-1}
      LINX_SKU_IS_PRODUTO: ${LINX_SKU_IS_PRODUTO:-false}
      LINX_PRODUTO_TABLE: ${LINX_PRODUTO_TABLE:-PRODUTOS}
      LINX_PRODUTO_COL_CODIGO: ${LINX_PRODUTO_COL_CODIGO:-PRODUTO}
      LINX_PRODUTO_COL_SKU: ${LINX_PRODUTO_COL_SKU:-}
      LINX_DATE_FORMAT: ${LINX_DATE_FORMAT:-%d/%m/%Y}
      CERT_API_KEY: ${CERT_API_KEY:?CERT_API_KEY is required}
    volumes:
      - cert-reports:/app/reports
      # Certificate PDFs (INMETRO/ANVISA evidence) live in CERTS_DIR=/app/certs
      # (apps/cert-api/app/config.py). Without this named volume they are lost on
      # container restart.
      - cert-certs:/app/certs
    depends_on:
      cert-volumes-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?VITE_GOOGLE_CLIENT_ID is required}
    container_name: importacao-web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      CERT_API_KEY: ${CERT_API_KEY:?CERT_API_KEY is required}
    depends_on:
      api:
        condition: service_healthy
      cert-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        gw_priority: 100
      n8n_enterprise_web:
        gw_priority: 0

  certbot:
    image: certbot/certbot
    container_name: importacao-certbot
    profiles: ["tls"]  # enable only after domain+DNS configured: `docker compose --profile tls up -d certbot`
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Initial issuance: docker compose -f docker-compose.prod.yml run --rm certbot certonly ...
    # Renewal: use scripts/renew-certs.sh via cron (twice daily)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done"
    depends_on:
      - web

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: importacao-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: importacao-alertmanager
    restart: unless-stopped
    # Internal only: Prometheus reaches it at alertmanager:9093 over the default
    # compose network. No host port published (no public exposure).
    expose:
      - "9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:11.2.2
    container_name: importacao-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3030}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  pgdata:
  redisdata:
  uploads:
  cert-reports:
  cert-certs:
  prometheusdata:
  grafanadata:
  alertmanagerdata:
  letsencrypt:
  certbot-webroot:

networks:
  ia-local-net:
    external: true
  # Traefik resolves importacao-web on this existing edge network.
  # Declare it so container recreation preserves public HTTPS connectivity.
  n8n_enterprise_web:
    external: true

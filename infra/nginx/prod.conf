# =============================================================================
# infra/nginx/prod.conf — Production Nginx with TLS + Let's Encrypt
# =============================================================================
# Usage: envsubst '$DOMAIN $CERT_API_KEY' < infra/nginx/prod.conf > /etc/nginx/conf.d/default.conf

resolver 127.0.0.11 valid=30s ipv6=off;

# Redirect HTTP to HTTPS (except ACME challenge)
server {
    listen 80;
    server_name ${DOMAIN};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS preload (max-age = 2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location = /_cert_api_auth {
        internal;
        # ESTE proxy_pass precisa ser por variavel, mesmo sendo uma subrequest
        # interna, e o motivo nao e obvio: com hostname LITERAL o nginx registra um
        # upstream implicito chamado "api:3001" no carregamento da config. Quando o
        # `proxy_pass $api_upstream` de /api vai resolver, o nginx procura primeiro
        # entre os grupos ja descritos, ACHA esse implicito e usa o IP congelado no
        # boot — sem nunca consultar o `resolver`. Ou seja: um unico proxy_pass
        # literal aqui anula a resolucao dinamica do /api inteiro.
        # Foi o que reabriu o incidente de 2026-06-22 em 2026-07-16 (login do time
        # fora do ar: 502 em /api/* apos a API ser recriada num deploy).
        # A URI do upstream faz parte da variavel: com URI no proxy_pass o nginx
        # a envia como esta, substituindo a URI original da subrequest.
        set $api_auth_upstream http://api:3001/api/auth/cert-api-access;
        proxy_pass $api_auth_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        # Preserve the main browser request for the Node authorization policy.
        # The auth subrequest itself is always GET /_cert_api_auth, so it cannot
        # infer the protected cert-api route without these gateway-controlled
        # headers.
        proxy_set_header X-Cert-Original-URI $request_uri;
        proxy_set_header X-Cert-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @cert_api_unauthorized {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 401 '{"error":"Unauthorized"}';
    }

    location @cert_api_forbidden {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 403 '{"error":"Forbidden"}';
    }

    location /cert-api/ {
        auth_request /_cert_api_auth;
        error_page 401 = @cert_api_unauthorized;
        error_page 403 = @cert_api_forbidden;
        auth_request_set $cert_actor_id $upstream_http_x_cert_actor_id;
        auth_request_set $cert_actor_email $upstream_http_x_cert_actor_email;
        auth_request_set $cert_actor_role $upstream_http_x_cert_actor_role;

        set $cert_api_upstream http://cert-api:8000;
        rewrite ^/cert-api/(.*) /$1 break;
        proxy_pass $cert_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-API-Key "${CERT_API_KEY}";
        # Client-provided values with these names are overwritten. cert-api can
        # use them for audit attribution without trusting browser form fields.
        proxy_set_header X-Cert-Actor-Id $cert_actor_id;
        proxy_set_header X-Cert-Actor-Email $cert_actor_email;
        proxy_set_header X-Cert-Actor-Role $cert_actor_role;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection "0" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    location /api {
        # Upstream via variavel + resolver (linha 6) para o nginx RE-RESOLVER o IP
        # da API a cada recriacao do container. Com proxy_pass literal, o nginx
        # cacheia o IP no boot e devolve 502 quando a API e recriada num deploy
        # (incidente 2026-06-22). Mesmo padrao ja usado em /cert-api/.
        # Sem URI na variavel, a URI original do request e repassada intacta —
        # mesma semantica do `proxy_pass http://api:3001;` que estava aqui.
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com;" always;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com;" always;
        try_files $uri $uri/ /index.html;
    }
}

# Alertmanager configuration for the importacao monitoring stack.
#
# Prometheus (infra/prometheus/prometheus.yml -> alerting:) ships alerts here.
# The alert rules themselves live in infra/prometheus/alerts.yml.
#
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT — Google Chat is NOT directly compatible with Alertmanager.
# Alertmanager's native webhook posts its own JSON schema
# (https://prometheus.io/docs/alerting/latest/configuration/#webhook_config):
#   {"version":"4","status":"firing","alerts":[...],"commonLabels":{...}, ...}
# Google Chat incoming webhooks expect a completely different body, e.g.
#   {"text": "..."}  (or a cardsV2 payload).
# Posting the Alertmanager payload straight at a Google Chat webhook URL will
# fail (400) or render as garbage. To deliver to Google Chat you MUST run a
# small bridge/adapter that receives the Alertmanager webhook and re-emits a
# {"text": ...} body to the chat.googleapis.com space URL.
#
# Point ALERTMANAGER_WEBHOOK_URL at that bridge (NOT at the Google Chat URL).
# The bridge then holds the real GOOGLE_CHAT_WEBHOOK_URL and does the reformat.
# (The api service already knows how to post to Google Chat; a thin adapter
# endpoint or a tiny prometheus-msteams-style relay both work.)
# ─────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m

route:
  # Collapse alerts that share these labels into a single notification.
  group_by: ['alertname', 'severity']
  # Wait a bit to batch the first notification of a new group.
  group_wait: 30s
  # Wait before sending a notification about new alerts added to a group.
  group_interval: 5m
  # Re-send a still-firing alert at most this often, to avoid notification spam.
  repeat_interval: 4h
  receiver: 'default-webhook'

receivers:
  - name: 'default-webhook'
    # The bridge/adapter URL (see header) — point this at the Google Chat bridge,
    # NOT at chat.googleapis.com directly.
    #
    # NOTE: Alertmanager does NOT expand ${ENV} placeholders inside this file. The
    # ALERTMANAGER_WEBHOOK_URL var (declared on the alertmanager service / .env.example)
    # documents the value to use; replace the placeholder below with it at deploy
    # time (or template this file via your deploy/rsync step). Until a real bridge
    # is deployed, leave the placeholder — alerts will fail to deliver loudly in the
    # Alertmanager logs rather than silently, which is the desired fail-visible state.
    webhook_configs:
      - url: 'http://CHANGE-ME-alertmanager-webhook-bridge/alert'
        send_resolved: true

    # ── Native email alternative (no bridge needed) ──────────────────────────
    # Alertmanager speaks SMTP natively. To use email instead of (or alongside)
    # the webhook bridge, fill `global.smtp_*` above and uncomment below. SMTP
    # creds can be the same relay the api uses (SMTP_HOST/SMTP_PORT/SMTP_USER/...).
    # email_configs:
    #   - to: 'ti-alertas@grupounico.com'
    #     from: 'alertmanager@grupounico.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'your-smtp-user'
    #     auth_password: 'your-smtp-app-password'
    #     require_tls: true
    #     send_resolved: true

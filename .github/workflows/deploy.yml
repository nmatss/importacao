name: Acesso ao deploy de producao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    name: Abrir controle privado de deploy
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar destino do deploy
        run: |
          echo "Deploys de producao foram movidos para o controle privado."
          echo "https://github.com/nmatss/importacao-deploy/actions/workflows/deploy.yml"
          {
            echo "### Deploy de producao"
            echo "Abra [Deploy Importacao](https://github.com/nmatss/importacao-deploy/actions/workflows/deploy.yml)."
            echo "Este workflow apenas mostra o acesso; nao executa deploy."
            echo "O controle privado usa master deste repositorio e scripts/deploy.sh."
          } >> "$GITHUB_STEP_SUMMARY"

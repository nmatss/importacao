services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-importacao}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      API_PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_PROVIDER: ${AI_PROVIDER:-ialocal}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-false}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-200}
      IA_LOCAL_BASE_URL: ${IA_LOCAL_BASE_URL:-http://ia-local-gateway:8443/v1}
      IA_LOCAL_API_KEY: ${IA_LOCAL_API_KEY:-}
      IA_LOCAL_MODEL: ${IA_LOCAL_MODEL:-unico-docintel}
      IA_LOCAL_EMBED_MODEL: ${IA_LOCAL_EMBED_MODEL:-bge-m3}
      IA_LOCAL_ALLOWED_HOSTS: ${IA_LOCAL_ALLOWED_HOSTS:-ia-local-gateway}
      AI_USE_SPECIALIST: ${AI_USE_SPECIALIST:-1}
      AI_LOCAL_CHAT_TIMEOUT_MS: ${AI_LOCAL_CHAT_TIMEOUT_MS:-360000}
      GOOGLE_DRIVE_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_DRIVE_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      KIOM_EMAIL: ${KIOM_EMAIL:-}
      FENICIA_EMAIL: ${FENICIA_EMAIL:-}
      ISA_EMAIL: ${ISA_EMAIL:-}
      COMMUNICATION_ALLOWED_RECIPIENTS: ${COMMUNICATION_ALLOWED_RECIPIENTS:-}
      GMAIL_SHARED_MAILBOX: ${GMAIL_SHARED_MAILBOX:-}
      EMAIL_INGESTION_ENABLED: ${EMAIL_INGESTION_ENABLED:-false}
      EMAIL_ALLOWED_SENDERS: ${EMAIL_ALLOWED_SENDERS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCUMENT_PROCESSING_STALE_MINUTES: ${DOCUMENT_PROCESSING_STALE_MINUTES:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      SYDLE_SYNC_ENABLED: ${SYDLE_SYNC_ENABLED:-false}
      SYDLE_SOURCE_TYPE: ${SYDLE_SOURCE_TYPE:-generic}
      SYDLE_BASE_URL: ${SYDLE_BASE_URL:-}
      SYDLE_API_TOKEN: ${SYDLE_API_TOKEN:-}
      SYDLE_PAYMENTS_PATH: ${SYDLE_PAYMENTS_PATH:-/api/purchase-payments}
      SYDLE_AUTH_HEADER: ${SYDLE_AUTH_HEADER:-Authorization}
      SYDLE_AUTH_SCHEME: ${SYDLE_AUTH_SCHEME:-Bearer}
      SYDLE_UPDATED_AFTER_PARAM: ${SYDLE_UPDATED_AFTER_PARAM:-updatedAfter}
      SYDLE_PAGE_PARAM: ${SYDLE_PAGE_PARAM:-page}
      SYDLE_PAGE_SIZE_PARAM: ${SYDLE_PAGE_SIZE_PARAM:-pageSize}
      SYDLE_PAGE_SIZE: ${SYDLE_PAGE_SIZE:-200}
      SYDLE_TIMEOUT_MS: ${SYDLE_TIMEOUT_MS:-30000}
      SYDLE_APP: ${SYDLE_APP:-main}
      SYDLE_USER: ${SYDLE_USER:-}
      SYDLE_PASSWORD: ${SYDLE_PASSWORD:-}
      SYDLE_CLASS_ID: ${SYDLE_CLASS_ID:-}
      SYDLE_DATE_FIELD: ${SYDLE_DATE_FIELD:-_lastUpdateDate}
      SYDLE_TICKET_CLASS_ID: ${SYDLE_TICKET_CLASS_ID:-5d446dfc62d9656275a47d69}
      SYDLE_TICKET_STATUS_CLASS_ID: ${SYDLE_TICKET_STATUS_CLASS_ID:-5cacdc04a50bfe4c0d3e5c74}
      SYDLE_CURRENCY_CLASS_ID: ${SYDLE_CURRENCY_CLASS_ID:-000000000000000000000059}
      GOOGLE_ADMIN_EMAIL: ${GOOGLE_ADMIN_EMAIL:-}
      GOOGLE_GROUP_ALLOWED: ${GOOGLE_GROUP_ALLOWED:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  cert-api:
    build:
      context: ./apps/cert-api
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_DRIVE_CLIENT_EMAIL:-}
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_DRIVE_PRIVATE_KEY:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:?GOOGLE_SHEETS_SPREADSHEET_ID required}
      WMS_ORACLE_HOST: ${WMS_ORACLE_HOST:?WMS_ORACLE_HOST required}
      WMS_ORACLE_PORT: ${WMS_ORACLE_PORT:?WMS_ORACLE_PORT required}
      WMS_ORACLE_SID: ${WMS_ORACLE_SID:?WMS_ORACLE_SID required}
      WMS_ORACLE_USER: ${WMS_ORACLE_USER:?WMS_ORACLE_USER required}
      WMS_ORACLE_PASS: ${WMS_ORACLE_PASS:?WMS_ORACLE_PASS required}
      ERP_PUKET_HOST: ${ERP_PUKET_HOST:?ERP_PUKET_HOST required}
      ERP_PUKET_DB: ${ERP_PUKET_DB:?ERP_PUKET_DB required}
      ERP_IMG_HOST: ${ERP_IMG_HOST:?ERP_IMG_HOST required}
      ERP_IMG_DB: ${ERP_IMG_DB:?ERP_IMG_DB required}
      ERP_MSSQL_USER: ${ERP_MSSQL_USER:?ERP_MSSQL_USER required}
      ERP_MSSQL_PASS: ${ERP_MSSQL_PASS:?ERP_MSSQL_PASS required}
      CERT_API_KEY: ${CERT_API_KEY:?CERT_API_KEY required}
    volumes:
      - cert-reports:/app/reports
      # Certificate PDFs (INMETRO/ANVISA evidence) live in CERTS_DIR=/app/certs
      # (apps/cert-api/app/config.py). Without this named volume they are lost on
      # container restart.
      - cert-certs:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:80"
    environment:
      CERT_API_KEY: ${CERT_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      cert-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  uploads:
  cert-reports:
  cert-certs:
